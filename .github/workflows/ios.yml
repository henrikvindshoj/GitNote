name: iOS

on:
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 20
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          device = next(d for runtime in devices.values() for d in runtime if d["name"].startswith("iPhone"))
          print("device_id=" + device["udid"])
          PYCODE
      - name: Build and run signed simulator tests
        run: >-
          xcodebuild
          -project apps/ios/GitNote.xcodeproj
          -scheme GitNote
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}'
          -derivedDataPath /tmp/GitNoteDerivedData
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_ALLOWED=YES
          test
